name: Build Kernel

on:
  workflow_dispatch:
    inputs:
      config:
          description: 'kernel config target'
          required: true
          default: 'xiaomi-tissot.config'
      kernelname:
          description: 'Kernel name'
          required: true
          default: 'mainline'


jobs:
  build:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Jakarta
      CONFIG: ${{ github.event.inputs.config }}
      KERNELNAME: ${{ github.event.inputs.kernelname }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison flex libssl-dev build-essential \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi \
            gcc-arm-linux-gnueabihf python3 aria2 cpio
      - name: Clone AOSP Clang 20
        run: |
          mkdir -p prebuilts/clang/host/linux-x86/clang-r547379
          aria2c -x 16 -s 16 -k 1M https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r547379.tar.gz
          tar -xzf clang-r547379.tar.gz -C prebuilts/clang/host/linux-x86/clang-r547379
      # 4. Set environment variables
      - name: Export build vars
        run: |
          export KERNEL_DIR=$PWD
          export CLANG_PATH=$PWD/prebuilts/clang/host/linux-x86/clang-r547379/bin
          echo "PATH=$CLANG_PATH:/usr/bin:$PATH" >> $GITHUB_ENV
          echo "KERNEL_DIR=$KERNEL_DIR" >> $GITHUB_ENV
      - name: Start kernel build
        run: |
          export PATH="$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM=1
          export LLVM_IAS=1
          export KBUILD_BUILD_USER=Reiame
          export KBUILD_BUILD_HOST=Mika
          mkdir -p out
          make O=out defconfig msm8953.config xiaomi-tissot.config
          make -j$(nproc --all) O=out \
      - name: gabungin Image.gz > Image.gz-dtb
        run: |
          cat out/arch/arm64/boot/Image.gz out/arch/arm64/boot/dts/qcom/msm8953-xiaomi-tissot.dtb  > out/arch/arm64/boot/Image.gz-dtb
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Image.gz with dtb
          path: out/arch/arm64/boot/Image.gz-dtb
